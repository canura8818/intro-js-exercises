<html>
    <head>
        <title>Box Map Examples</title>
        <style>
            *  {
               border-width: 3px;
               border-style: groove;
               border-color: orange;
            }

            p { padding: 1rem; }
            div { 
                padding: 1rem 2rem 3rem 4rem;
                border-top-color: yellow;
                border-bottom-color: purple;
                width: 100%;
                height: 75%;
                box-sizing: border-box;
            }

            em {
                display: block;
                padding: 1rem 2rem;

                position: sticky;
                top: 10px;
                left: 50px;
            }

            nav ul  {
                display: flex;
                flex-direction: column-reverse;
                justify-content: space-evenly;
                list-style: none;
                padding: 0;
            }

            nav ul li {
                width: 8rem;
                text-align: center;
                background-color: bisque;
                padding: 1rem;

                display: flex;
                justify-content: flex-start;
                align-items: flex-start;
            }

            footer {
                font-weight: bolder;
            }
        </style>
    </head>

    <body>
        <nav>
            <ul>
                <li><a href="https://monkeytype.com/">MonkeyType</a></li>
                <li><a href="https://nytimes.com/">NYTimes</a></li>
            </ul>
        </nav>
        Greetings! <p>This is just me practicing styling</p>
        Hello, my name is Tatar and today I will be playing some Dota 2
        <div>This is some more text</div>

        <p>I want to eat creme brulee, tiramisu, and banana bread<em>
            However, italicizing can be impactful: semantics matter.
        </em></p>

        <footer>
            chiti chiti bang bang
        </footer>
        
    </body>
</html>
